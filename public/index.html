<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue Tracker</title>
<style>
:root{color-scheme:light dark;--bg:#f6f6f3;--card:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#e3e3de;--ac:#0f766e;--acx:#fff;--hi:#dc2626;--md:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#16181a;--card:#1f2326;--tx:#e8eaed;--mu:#9aa1a9;--bd:#32373c;--ac:#2dd4bf;--acx:#06201d;--hi:#f87171;--md:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1150px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.drop{border:2px dashed var(--bd);background:var(--card);border-radius:12px;padding:18px;text-align:center;cursor:pointer}
.drop.on{border-color:var(--ac)}
.drop span{color:var(--mu);font-size:13px;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:14px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.5}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative}.thumb img{height:60px;border-radius:6px;border:1px solid var(--bd);display:block}
.thumb i{position:absolute;top:-6px;right:-6px;background:var(--hi);color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;text-align:center;font-style:normal;cursor:pointer}
.msg{font-size:13px;color:var(--mu)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:860px){.board{grid-template-columns:1fr}}
.col{background:color-mix(in srgb,var(--card) 55%,var(--bg));border:1px solid var(--bd);border-radius:12px;padding:10px;min-height:90px}
.col h2{font-size:12px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.card h3{font-size:14px;margin:0 0 4px}
.meta{font-size:12px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.High{color:var(--hi);font-weight:700}.Medium{color:var(--md);font-weight:700}.Low{font-weight:700}
.card p{margin:0 0 6px;font-size:13px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:4px 6px;max-width:100%}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button,.acts a{padding:3px 8px;font-size:12px;color:var(--mu)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.panel textarea{width:100%;min-height:140px;font-size:13px}
.up{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.up input{width:100%}.hide{display:none}.note{font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<div class="wrap">
<h1>Issue Tracker</h1>
<div id="drop" class="drop">
  <b>Klik, drag, atau paste (Ctrl+V) screenshot WA</b><span>Bisa banyak gambar sekaligus</span>
  <input id="file" type="file" accept="image/*" multiple hidden>
</div>
<div id="thumbs" class="thumbs" style="margin-top:10px"></div>
<div class="row">
  <button id="go" class="p" disabled>Ekstrak Issue</button>
  <button id="add">+ Manual</button>
  <button id="eos">Update Akhir Shift</button>
  <a class="btn" href="/api/export.csv">Export CSV</a>
  <span id="msg" class="msg"></span>
</div>
<div id="eosPanel" class="panel hide">
  <b>Update Akhir Shift</b>
  <div id="eosList"></div>
  <div class="row"><button id="gen" class="p">Buat Laporan</button><button id="copy">Salin</button></div>
  <textarea id="report"></textarea>
</div>
<div id="board" class="board"></div>
</div>
<script>
const COLS=["To Do","In Progress","Blocked","Done"];
let items=[],pending=[];
const $=id=>document.getElementById(id);
const say=t=>$("msg").textContent=t;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}return r}
const jpost=(m,u,b)=>api(u,{method:m,headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});

async function load(){items=await (await api("/api/issues")).json();render()}
function render(){
  $("board").innerHTML=COLS.map(c=>{
    const l=items.filter(i=>i.status===c);
    return `<div class="col"><h2><span>${c}</span><span>${l.length}</span></h2>`+l.map(i=>`
    <div class="card" data-id="${i.id}">
      <h3>${esc(i.title)}</h3>
      <div class="meta"><span class="${i.priority}">${i.priority}</span>${i.requester?`<span>dari ${esc(i.requester)}</span>`:""}${i.deadline?`<span>deadline ${esc(i.deadline)}</span>`:""}</div>
      ${i.summary?`<p>${esc(i.summary)}</p>`:""}${i.note?`<p class="note">Catatan: ${esc(i.note)}</p>`:""}
      <div class="acts">
        <select data-a="status">${COLS.map(s=>`<option ${s===i.status?"selected":""}>${s}</option>`).join("")}</select>
        <button data-a="edit">Edit</button>
        ${i.screenshot?`<a class="btn" target="_blank" href="/uploads/${esc(i.screenshot.split(",")[0])}">Chat</a>`:""}
        <button data-a="del">Hapus</button>
      </div>
    </div>`).join("")+"</div>"}).join("");
}
$("board").addEventListener("change",async e=>{
  if(e.target.dataset.a!=="status")return;
  await jpost("PATCH","/api/issues/"+e.target.closest(".card").dataset.id,{status:e.target.value});load()});
$("board").addEventListener("click",async e=>{
  const a=e.target.dataset.a;if(!a||a==="status")return;
  const id=e.target.closest(".card").dataset.id,it=items.find(i=>i.id==id);
  if(a==="del"&&confirm("Hapus issue ini?")){await api("/api/issues/"+id,{method:"DELETE"});load()}
  if(a==="edit"){
    const t=prompt("Judul",it.title);if(t===null)return;
    const d=prompt("Deadline",it.deadline);if(d===null)return;
    const p=prompt("Prioritas (High/Medium/Low)",it.priority);if(p===null)return;
    try{await jpost("PATCH","/api/issues/"+id,{title:t,deadline:d,priority:p});load()}catch(err){say(err.message)}}
});
$("add").onclick=async()=>{const t=prompt("Judul issue");if(!t)return;await jpost("POST","/api/issues",{title:t});load()};

function addFiles(fs){[...fs].filter(f=>f.type.startsWith("image/")).forEach(f=>pending.push(f));thumbs()}
function thumbs(){
  $("thumbs").innerHTML="";
  pending.forEach((f,i)=>{const d=document.createElement("div");d.className="thumb";
    const im=document.createElement("img");im.src=URL.createObjectURL(f);
    const x=document.createElement("i");x.textContent="×";x.onclick=()=>{pending.splice(i,1);thumbs()};
    d.append(im,x);$("thumbs").append(d)});
  $("go").disabled=!pending.length;
}
const drop=$("drop");
drop.onclick=()=>$("file").click();
$("file").onchange=e=>{addFiles(e.target.files);e.target.value=""};
drop.ondragover=e=>{e.preventDefault();drop.classList.add("on")};
drop.ondragleave=()=>drop.classList.remove("on");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("on");addFiles(e.dataTransfer.files)};
document.addEventListener("paste",e=>addFiles([...(e.clipboardData?.files||[])]));
$("go").onclick=async()=>{
  $("go").disabled=true;say("Membaca screenshot...");
  const fd=new FormData();
  for(const f of pending){const b=await shrink(f);fd.append("files",b,"chat.jpg")}
  try{const r=await (await api("/api/extract",{method:"POST",body:fd})).json();
    pending=[];thumbs();say(r.added?`${r.added} issue ditambahkan.`:"Tidak ada issue baru.");load()}
  catch(e){say("Gagal: "+e.message);$("go").disabled=false}
};

$("eos").onclick=()=>{
  const p=$("eosPanel");p.classList.toggle("hide");if(p.classList.contains("hide"))return;
  const open=items.filter(i=>i.status!=="Done");
  $("eosList").innerHTML=open.length?open.map(i=>`<div class="up" data-id="${i.id}">
    <div><b>${esc(i.title)}</b><br><input placeholder="Catatan (opsional)" value="${esc(i.note)}"></div>
    <select>${COLS.map(s=>`<option ${s===i.status?"selected":""}>${s}</option>`).join("")}</select></div>`).join(""):'<div class="note">Semua sudah selesai.</div>';
};
$("gen").onclick=async()=>{
  for(const r of document.querySelectorAll("#eosList .up")){
    const it=items.find(i=>i.id==r.dataset.id);if(!it)continue;
    const status=r.querySelector("select").value,note=r.querySelector("input").value.trim();
    if(status!==it.status||note!==(it.note||""))await jpost("PATCH","/api/issues/"+it.id,{status,note});
  }
  await load();$("report").value=await (await api("/api/report")).text();
};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("report").value);say("Tersalin.")}catch(e){$("report").select()}};
async function shrink(f){
  try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.85))}catch(e){return f}
}
load();
</script>
</body>
</html>
