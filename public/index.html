<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issue Tracker</title>
<style>
:root{color-scheme:light dark;--bg:#f6f6f3;--card:#fff;--tx:#1f2328;--mu:#6b7280;--bd:#e3e3de;--ac:#0f766e;--acx:#fff;--hi:#dc2626;--md:#d97706}
@media (prefers-color-scheme:dark){:root{--bg:#16181a;--card:#1f2326;--tx:#e8eaed;--mu:#9aa1a9;--bd:#32373c;--ac:#2dd4bf;--acx:#06201d;--hi:#f87171;--md:#fbbf24}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.drop{border:2px dashed var(--bd);background:var(--card);border-radius:12px;padding:14px;text-align:center;cursor:pointer}
.drop.on{border-color:var(--ac)}
.drop span{color:var(--mu);font-size:13px;display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;text-decoration:none;font-size:14px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.on{border-color:var(--ac);color:var(--ac)}
button:disabled{opacity:.5}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative}.thumb img{height:56px;border-radius:6px;border:1px solid var(--bd);display:block}
.thumb i{position:absolute;top:-6px;right:-6px;background:var(--hi);color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;text-align:center;font-style:normal;cursor:pointer}
.msg{font-size:13px;color:var(--mu)}
.stats{font-size:13px;color:var(--mu);margin:4px 0 8px}
.stats b{color:var(--tx)}.stats .late{color:var(--hi)}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;max-width:100%}
.tabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
.tabs button{white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
@media(min-width:861px){.tabs{display:none}}
@media(max-width:860px){.board{grid-template-columns:1fr}.col{display:none}.col.on{display:block}}
.col{background:color-mix(in srgb,var(--card) 55%,var(--bg));border:1px solid var(--bd);border-radius:12px;padding:10px;min-height:80px}
.col h2{font-size:12px;margin:0 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin-bottom:7px;border-left:3px solid var(--bd)}
.card.High{border-left-color:var(--hi)}.card.Medium{border-left-color:var(--md)}
.card.late{background:color-mix(in srgb,var(--hi) 8%,var(--card))}
.card h3{font-size:14px;margin:0;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open h3{-webkit-line-clamp:unset}
.meta{font-size:12px;color:var(--mu);display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:3px}
.meta .late{color:var(--hi);font-weight:700}
.card p{margin:6px 0 0;font-size:13px;white-space:pre-wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.acts button,.acts a{padding:3px 8px;font-size:12px}
.q{padding:2px 8px;font-size:12px;margin-top:6px;border-color:var(--ac);color:var(--ac)}
.hist{font-size:12px;color:var(--mu);margin-top:6px}
.more{width:100%;font-size:12px;color:var(--mu)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
.panel textarea{width:100%;min-height:130px;font-size:13px}
.up{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.up input{width:100%}.hide{display:none}.note{font-size:12px;color:var(--mu)}
details summary{cursor:pointer;font-size:13px;color:var(--mu);margin:8px 0}
.arow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>Issue Tracker</h1>
<div id="drop" class="drop"><b>Klik, drag, atau paste (Ctrl+V) screenshot WA</b><span>Bisa banyak gambar sekaligus. Screenshot yang sama tidak diproses dua kali.</span>
<input id="file" type="file" accept="image/*" multiple hidden></div>
<div id="thumbs" class="thumbs"></div>
<div class="row">
  <button id="go" class="p" disabled>Ekstrak Issue</button>
  <button id="add">+ Manual</button>
  <button id="eos">Update Akhir Shift</button>
  <button id="arch">Arsip</button>
  <a class="btn" href="/api/export.csv">Export CSV</a>
  <span id="msg" class="msg"></span>
</div>

<div id="eosPanel" class="panel hide">
  <b>Update Akhir Shift</b>
  <div id="eosList"></div>
  <div class="row"><button id="gen" class="p">Buat Laporan</button><button id="copy">Salin</button></div>
  <textarea id="report"></textarea>
</div>

<div id="archPanel" class="panel hide">
  <div class="row" style="margin-top:0"><b>Arsip (selesai lebih dari 1,5 hari lalu)</b>
  <input id="aq" placeholder="Cari di arsip..." style="flex:1;min-width:160px"></div>
  <div id="aList"></div>
  <button id="aMore" class="more hide">Muat lebih banyak</button>
</div>

<div class="row">
  <input id="q" placeholder="Cari judul, peminta, catatan..." style="flex:1;min-width:180px">
  <select id="fp"><option value="">Semua prioritas</option><option>High</option><option>Medium</option><option>Low</option></select>
  <select id="fr"><option value="">Semua peminta</option></select>
  <button id="late">Terlambat saja</button>
</div>
<div id="stats" class="stats"></div>
<div id="tabs" class="tabs"></div>
<div id="board" class="board"></div>
</div>

<script>
const COLS=["To Do","In Progress","Blocked","Done"], CAP=8;
let items=[],pending=[],open=new Set(),hist={},showAll={},view="To Do",onlyLate=false;
let arch={items:[],offset:0,more:false,q:""};
const $=id=>document.getElementById(id);
const say=t=>$("msg").textContent=t;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(u,o){const r=await fetch(u,o);if(!r.ok){let m=r.statusText;try{m=(await r.json()).detail||m}catch(e){}throw new Error(m)}return r}
const jsend=(m,u,b)=>api(u,{method:m,headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});

function dlDate(i){
  const s=i.deadline_at;if(!s)return null;
  const d=new Date((s.length===10?s+"T23:59:00":s.replace(" ","T")+":00")+"+07:00");
  return isNaN(d)?null:d;
}
const isLate=i=>i.status!=="Done"&&dlDate(i)&&dlDate(i)<new Date();
function ago(iso){
  const m=(Date.now()-new Date(iso))/60000;
  if(m<60)return Math.max(1,Math.round(m))+" mnt";
  if(m<1440)return Math.round(m/60)+" jam";
  return Math.round(m/1440)+" hari";
}
const nextStatus={"To Do":["In Progress","Mulai"],"Blocked":["In Progress","Lanjut"],"In Progress":["Done","Selesai"]};

async function load(){items=await (await api("/api/issues")).json();render()}

function filtered(){
  const q=$("q").value.trim().toLowerCase(),fp=$("fp").value,fr=$("fr").value;
  return items.filter(i=>(!fp||i.priority===fp)&&(!fr||i.requester===fr)&&(!onlyLate||isLate(i))&&
    (!q||(i.title+" "+i.summary+" "+i.requester+" "+i.note).toLowerCase().includes(q)));
}
function fillRequesters(){
  const cur=$("fr").value,names=[...new Set(items.map(i=>i.requester).filter(Boolean))].sort();
  $("fr").innerHTML='<option value="">Semua peminta</option>'+names.map(n=>`<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("");
}
function cardHtml(i){
  const o=open.has(i.id),late=isLate(i),nx=nextStatus[i.status];
  return `<div class="card ${i.priority} ${late?"late":""} ${o?"open":""}" data-id="${i.id}">
    <h3 data-a="toggle">${esc(i.title)}</h3>
    <div class="meta">
      ${i.requester?`<span>${esc(i.requester)}</span>`:""}
      ${i.deadline?`<span class="${late?"late":""}">${late?"Terlambat · ":"Deadline "}${esc(i.deadline)}</span>`:""}
      <span>${i.status==="Done"?"selesai":"umur"} ${ago(i.status==="Done"&&i.done_at?i.done_at:i.created_at)}</span>
    </div>
    ${nx&&!o?`<button class="q" data-a="next">${nx[1]}</button>`:""}
    ${o?`${i.summary?`<p>${esc(i.summary)}</p>`:""}${i.note?`<p class="note">Catatan: ${esc(i.note)}</p>`:""}
      <div class="acts">
        <select data-a="status">${COLS.map(s=>`<option ${s===i.status?"selected":""}>${s}</option>`).join("")}</select>
        <button data-a="edit">Edit</button><button data-a="note">Catatan</button>
        <button data-a="hist">Riwayat</button>
        ${i.screenshot?`<a class="btn" target="_blank" href="/uploads/${esc(i.screenshot.split(",")[0])}">Chat</a>`:""}
        <button data-a="del">Hapus</button>
      </div>
      ${hist[i.id]?`<div class="hist">${hist[i.id]}</div>`:""}`:""}
  </div>`;
}
function render(){
  fillRequesters();
  const list=filtered(),late=items.filter(isLate).length;
  const today=new Date().toDateString();
  const doneToday=items.filter(i=>i.status==="Done"&&i.done_at&&new Date(i.done_at).toDateString()===today).length;
  $("stats").innerHTML=`<b>${items.filter(i=>i.status!=="Done").length}</b> terbuka · <span class="late"><b>${late}</b> terlambat</span> · <b>${doneToday}</b> selesai hari ini`;
  $("tabs").innerHTML=COLS.map(c=>`<button data-tab="${c}" class="${c===view?"on":""}">${c} (${list.filter(i=>i.status===c).length})</button>`).join("");
  $("board").innerHTML=COLS.map(c=>{
    let l=list.filter(i=>i.status===c);
    if(c==="Done")l.sort((a,b)=>(b.done_at||"").localeCompare(a.done_at||""));
    const cut=showAll[c]?l.length:CAP,shown=l.slice(0,cut);
    return `<div class="col ${c===view?"on":""}"><h2><span>${c}</span><span>${l.length}</span></h2>
      ${shown.map(cardHtml).join("")}
      ${l.length>cut?`<button class="more" data-more="${c}">Tampilkan semua (${l.length})</button>`:""}
      ${showAll[c]&&l.length>CAP?`<button class="more" data-less="${c}">Ringkas</button>`:""}
      ${c==="Done"?`<div class="note">Yang lebih lama ada di Arsip.</div>`:""}</div>`}).join("");
}
["q","fp","fr"].forEach(id=>$(id).addEventListener("input",render));
$("late").onclick=()=>{onlyLate=!onlyLate;$("late").classList.toggle("on",onlyLate);render()};
$("tabs").addEventListener("click",e=>{if(e.target.dataset.tab){view=e.target.dataset.tab;render()}});

$("board").addEventListener("click",async e=>{
  const t=e.target;
  if(t.dataset.more){showAll[t.dataset.more]=true;return render()}
  if(t.dataset.less){showAll[t.dataset.less]=false;return render()}
  const a=t.dataset.a,card=t.closest(".card");if(!a||!card||a==="status")return;
  const id=+card.dataset.id,it=items.find(i=>i.id===id);
  try{
    if(a==="toggle"){open.has(id)?open.delete(id):open.add(id);return render()}
    if(a==="next"){await jsend("PATCH","/api/issues/"+id,{status:nextStatus[it.status][0]});return load()}
    if(a==="del"&&confirm("Hapus issue ini? Screenshot-nya juga ikut terhapus.")){await api("/api/issues/"+id,{method:"DELETE"});return load()}
    if(a==="edit"){
      const ti=prompt("Judul",it.title);if(ti===null)return;
      const d=prompt("Deadline (format YYYY-MM-DD HH:MM supaya bisa diurutkan, atau teks bebas)",it.deadline);if(d===null)return;
      const p=prompt("Prioritas (High/Medium/Low)",it.priority);if(p===null)return;
      await jsend("PATCH","/api/issues/"+id,{title:ti,deadline:d,priority:p});return load()}
    if(a==="note"){const n=prompt("Catatan",it.note||"");if(n===null)return;await jsend("PATCH","/api/issues/"+id,{note:n});return load()}
    if(a==="hist"){
      if(hist[id]){delete hist[id];return render()}
      const ev=await (await api(`/api/issues/${id}/events`)).json();
      hist[id]=ev.map(x=>`${new Date(x.at).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})} · ${esc(x.kind==="status"?x.detail:x.kind==="note"?"catatan: "+x.detail:x.detail?x.kind+" ("+x.detail+")":x.kind)}`).join("<br>");
      return render()}
  }catch(err){say(err.message)}
});
$("board").addEventListener("change",async e=>{
  if(e.target.dataset.a!=="status")return;
  await jsend("PATCH","/api/issues/"+e.target.closest(".card").dataset.id,{status:e.target.value});load()});
$("add").onclick=async()=>{const t=prompt("Judul issue");if(!t)return;await jsend("POST","/api/issues",{title:t});load()};

/* upload */
function addFiles(fs){[...fs].filter(f=>f.type.startsWith("image/")).forEach(f=>pending.push(f));thumbs()}
function thumbs(){
  $("thumbs").innerHTML="";
  pending.forEach((f,i)=>{const d=document.createElement("div");d.className="thumb";
    const im=document.createElement("img");im.src=URL.createObjectURL(f);
    const x=document.createElement("i");x.textContent="×";x.onclick=()=>{pending.splice(i,1);thumbs()};
    d.append(im,x);$("thumbs").append(d)});
  $("go").disabled=!pending.length;
}
const drop=$("drop");
drop.onclick=()=>$("file").click();
$("file").onchange=e=>{addFiles(e.target.files);e.target.value=""};
drop.ondragover=e=>{e.preventDefault();drop.classList.add("on")};
drop.ondragleave=()=>drop.classList.remove("on");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("on");addFiles(e.dataTransfer.files)};
document.addEventListener("paste",e=>addFiles([...(e.clipboardData?.files||[])]));
async function shrink(f){
  try{const bmp=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",.85))}catch(e){return f}
}
$("go").onclick=async()=>{
  $("go").disabled=true;say("Membaca screenshot...");
  const fd=new FormData();
  for(const f of pending){fd.append("files",await shrink(f),"chat.jpg")}
  try{const r=await (await api("/api/extract",{method:"POST",body:fd})).json();
    pending=[];thumbs();
    say(r.added?`${r.added} issue ditambahkan.`:r.skipped&&!r.found?"Screenshot ini sudah pernah diproses.":"Tidak ada issue baru.");
    load()}
  catch(e){say("Gagal: "+e.message);$("go").disabled=false}
};

/* akhir shift */
$("eos").onclick=()=>{
  const p=$("eosPanel");p.classList.toggle("hide");if(p.classList.contains("hide"))return;
  const open_=items.filter(i=>i.status!=="Done");
  const row=i=>`<div class="up" data-id="${i.id}"><div><b>${esc(i.title)}</b><br><input placeholder="Catatan (opsional)" value="${esc(i.note)}"></div>
    <select>${COLS.map(s=>`<option ${s===i.status?"selected":""}>${s}</option>`).join("")}</select></div>`;
  const act=open_.filter(i=>i.status!=="To Do"),todo=open_.filter(i=>i.status==="To Do");
  $("eosList").innerHTML=(act.length?act.map(row).join(""):'<div class="note">Tidak ada yang sedang dikerjakan.</div>')+
    (todo.length?`<details><summary>Belum dimulai (${todo.length})</summary>${todo.map(row).join("")}</details>`:"");
};
$("gen").onclick=async()=>{
  for(const r of document.querySelectorAll("#eosList .up")){
    const it=items.find(i=>i.id==r.dataset.id);if(!it)continue;
    const status=r.querySelector("select").value,note=r.querySelector("input").value.trim();
    if(status!==it.status||note!==(it.note||""))await jsend("PATCH","/api/issues/"+it.id,{status,note});
  }
  await load();$("report").value=await (await api("/api/report")).text();
};
$("copy").onclick=async()=>{try{await navigator.clipboard.writeText($("report").value);say("Tersalin.")}catch(e){$("report").select()}};

/* arsip */
async function loadArch(reset){
  if(reset)arch={items:[],offset:0,more:false,q:$("aq").value.trim()};
  const r=await (await api(`/api/archive?q=${encodeURIComponent(arch.q)}&offset=${arch.offset}`)).json();
  arch.items=arch.items.concat(r.items);arch.offset+=r.items.length;arch.more=r.more;
  $("aList").innerHTML=arch.items.length?arch.items.map(i=>`<div class="arow"><div><b>${esc(i.title)}</b><div class="meta">${esc(i.requester)} · selesai ${new Date(i.done_at).toLocaleDateString("id-ID",{day:"numeric",month:"short"})}${i.note?" · "+esc(i.note):""}</div></div>
    <button data-reopen="${i.id}">Buka lagi</button></div>`).join(""):'<div class="note">Tidak ada hasil.</div>';
  $("aMore").classList.toggle("hide",!arch.more);
}
$("arch").onclick=()=>{const p=$("archPanel");p.classList.toggle("hide");if(!p.classList.contains("hide"))loadArch(true)};
let at;$("aq").oninput=()=>{clearTimeout(at);at=setTimeout(()=>loadArch(true),300)};
$("aMore").onclick=()=>loadArch(false);
$("aList").addEventListener("click",async e=>{
  const id=e.target.dataset.reopen;if(!id)return;
  await jsend("PATCH","/api/issues/"+id,{status:"To Do"});await load();loadArch(true)});

load();
</script>
</body>
</html>
